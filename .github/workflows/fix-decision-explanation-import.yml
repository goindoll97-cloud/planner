name: fix-decision-explanation-import

on:
  push:
    branches: [feature/decision-explanation-upgrade]
    paths:
      - '.github/workflows/fix-decision-explanation-import.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply import fix
        run: python scripts/fix_decision_explanation_import.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py engine ui
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stage1_workbook.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Fix decision explanation quantity normalization import"
            git push
          fi
