name: final-user-facing-name-cleanup

on:
  push:
    branches: [feature/decision-explanation-upgrade]
    paths:
      - '.github/workflows/final-user-facing-name-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final naming cleanup
        run: python scripts/final_user_facing_name_cleanup.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py engine ui
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/template.py engine/stage1_workbook.py tests/test_decision_explanation_contract.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Use full statutory names in company-facing text"
            git push
          fi
