name: legal-terminology-refactor

on:
  push:
    branches:
      - refactor/legal-terminology
    paths:
      - scripts/apply_legal_terminology.py
      - scripts/apply_legal_terminology_followup.py
      - scripts/apply_legal_terminology_precision.py
      - .github/workflows/legal-terminology-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/legal-terminology
          fetch-depth: 0
      - name: Apply statutory terminology
        run: |
          python scripts/apply_legal_terminology.py
          python scripts/apply_legal_terminology_followup.py
          python scripts/apply_legal_terminology_precision.py
      - name: Compile changed Python sources
        run: python -m compileall -q ui engine tests
      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui engine docs README.md tests
          git commit -m 'Align final decision wording with statutory terms'
          git push origin HEAD:refactor/legal-terminology
