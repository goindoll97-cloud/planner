name: Install 260409 CAP statutory DOCX
on:
  push:
    branches:
      - fix/use-260409-cap-only-remove-legacy-20261110
permissions:
  contents: write
jobs:
  replace-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docx support
        run: pip install python-docx
      - name: Generate and verify new statutory form
        run: python scripts/migrate_cap_template_260409.py
      - name: Commit the 260409 document and remove retired source and one-off tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/templates/cap/
          git rm scripts/migrate_cap_template_260409.py .github/workflows/migrate-cap-260409.yml
          git commit -m "Store sole 260409 CAP statutory DOCX and remove prior template files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
