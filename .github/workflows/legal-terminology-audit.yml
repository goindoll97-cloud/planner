name: legal-terminology-audit

on:
  push:
    branches:
      - refactor/legal-terminology

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit user-facing terminology
        shell: bash
        run: |
          echo '=== legal terminology precision audit ==='
          grep -RInE --include='*.py' --include='*.md' --include='*.json' \
            '트리거|대상 후보|대상후보|작성대상|수량기준|최종 R|R 재계산|재계산 결과|위험도|규정량 비율|화사계 상위기준 후보|화사계 하위기준 후보|대상업종|면제조건|면제시설|작성 면제|제외조건' \
            ui engine docs README.md tests || true
