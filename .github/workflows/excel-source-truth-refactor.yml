name: excel-source-truth-refactor

on:
  push:
    branches:
      - refactor/excel-source-of-truth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/excel-source-of-truth
          fetch-depth: 0
      - name: Apply workbook source-of-truth refactor
        run: python scripts/apply_excel_source_truth.py
      - name: Compile sources
        run: python -m compileall -q engine ui tests
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine ui tests README.md docs || true
          git commit -m 'Make company Excel the sole Stage 1 fact source'
          git push origin HEAD:refactor/excel-source-of-truth
