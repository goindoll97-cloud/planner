name: legal-reference-guide

on:
  push:
    branches: [feature/legal-reference-guide]
    paths:
      - '.github/workflows/legal-reference-guide.yml'
      - 'scripts/add_legal_reference_guide.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply separate legal reference workbook
        run: python scripts/add_legal_reference_guide.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py engine ui
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/template.py engine/__init__.py tests/test_template_contract.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add separate law reference workbook download"
            git push
          fi
