name: request-wording-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-wording-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply request wording fix
        run: python scripts/fix_request_wording.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py engine ui
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stage1_workbook.py ui/diagnosis_page.py
          git commit -m "Show legal basis in company correction requests"
          git push
# one-time migration; remove after successful run
