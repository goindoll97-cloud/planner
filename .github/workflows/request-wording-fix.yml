name: request-wording-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-wording-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply request wording fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('engine/stage1_workbook.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'requests.append(_request("05_최종판정조건", f"\'{applicable_key}\'를 Y/N으로 확인하여 작성해 주세요."))',
              'requests.append(_request("05_최종판정조건", f"근거: 「산업안전보건법」 제44조제1항 → 「산업안전보건법 시행령」 제43조제1항 및 별표 13 「유해·위험물질 규정량」 제{item_no}호({label}). 귀사의 취급물질·공정이 이 항목에 해당하는지 확인하여 Y/N으로 작성해 주세요."))'
          )
          t = t.replace(
              'requests.append(_request("05_최종판정조건", f"{label}에 해당하므로 \'{mfg_key}\'와 \'{storage_key}\'를 kg로 작성해 주세요. 미사용 구분은 0으로 입력합니다."))',
              'requests.append(_request("05_최종판정조건", f"근거: 「산업안전보건법」 제44조제1항 → 「산업안전보건법 시행령」 제43조제1항 및 별표 13 「유해·위험물질 규정량」 제{item_no}호({label}). 해당으로 확인된 경우 하루 최대 제조·취급량과 최대 저장량을 각각 kg로 작성해 주세요. 사용하지 않는 구분은 0으로 입력합니다."))'
          )
          old = 'requests.append(_request("05_최종판정조건", f"\'{key}\'를 확인하여 숫자(%)로 작성해 주세요."))'
          new = '''legal_name = {
                23: "별표 13 「유해·위험물질 규정량」 제23호 발연황산(삼산화황 중량 65% 이상 80% 미만)",
                42: "별표 13 「유해·위험물질 규정량」 제42호 니트로셀룰로오스(질소 함유량 12.6% 이상)",
            }[item_no]
            requests.append(_request("05_최종판정조건", f"근거: 「산업안전보건법」 제44조제1항 → 「산업안전보건법 시행령」 제43조제1항 및 {legal_name}. 제품 SDS, 시험성적서 또는 제조사 자료에서 해당 성분 함량을 확인하여 숫자(%)로 작성해 주세요."))'''
          if old not in t:
              raise SystemExit('special-condition replacement target not found')
          t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')

          p = Path('ui/diagnosis_page.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('import pandas as pd\n', 'import re\n\nimport pandas as pd\n', 1)
          marker = '''def _result_card(title: str, status: str, explanation: str) -> None:
    with st.container(border=True):
        st.markdown(f"### {title}")
        st.markdown(f"#### {status}")
        if explanation:
            st.write(explanation)
'''
          addition = marker + '''\n\ndef _display_request(value: str) -> str:
    """Hide workbook-internal sheet labels from company-facing requests."""
    text = str(value or "").strip()
    return re.sub(r"^(?:\\d{2}_[^:]+|회사 입력파일):\\s*", "", text)
'''
          if marker not in t:
              raise SystemExit('UI marker not found')
          t = t.replace(marker, addition, 1)
          t = t.replace('st.write(f"• {request}")', 'st.write(f"• {_display_request(request)}")')
          p.write_text(t, encoding='utf-8')

          p = Path('tests/test_request_wording_contract.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('self.assertIn("re.sub", text)', 'self.assertIn("re.sub", text)\n        self.assertIn("05_", text)  # internal stripping rule may reference technical sheet prefixes')
          p.write_text(t, encoding='utf-8')
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py engine ui
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stage1_workbook.py ui/diagnosis_page.py tests/test_request_wording_contract.py
          git commit -m "Show legal basis in company correction requests"
          git push
