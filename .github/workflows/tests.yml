name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      # The PDF rendering test must actually run in CI, not be skipped.
      CAP_PDF_FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Korean PDF font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum
          test -s "$CAP_PDF_FONT_PATH"
      - name: Install dependencies
        # pypdf is only used to verify extracted Hangul text in the test.
        run: pip install -r requirements.txt pytest==9.2.0 pypdf==5.9.0
      - name: Compile Python sources
        run: python -m compileall -q app.py engine ui
      - name: Run unit tests
        run: PYTHONUTF8=1 python -m pytest tests -q
